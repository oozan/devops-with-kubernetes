name: Release exercise 3.3 project

on:
  push:
    branches:
      - main
    paths:
      - "exercise-3.3/**"
      - ".github/workflows/exercise-3.3.yaml"

permissions:
  contents: read

env:
  PROJECT_ID: ${{ secrets.GKE_PROJECT }}
  GKE_CLUSTER: dwk-cluster
  GKE_ZONE: europe-north1-a
  REGISTRY: europe-north1-docker.pkg.dev
  REPOSITORY: dwk-repo
  PROJECT_IMAGE: project
  TODO_BACKEND_IMAGE: todo-backend

jobs:
  build-publish-deploy:
    name: Build, Publish and Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GKE_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker
        run: gcloud --quiet auth configure-docker "$REGISTRY"

      - name: Get GKE credentials
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ env.GKE_CLUSTER }}
          project_id: ${{ env.PROJECT_ID }}
          location: ${{ env.GKE_ZONE }}

      - name: Build and publish images
        run: |
          PROJECT_IMAGE_URI="$REGISTRY/$PROJECT_ID/$REPOSITORY/$PROJECT_IMAGE:$GITHUB_SHA"
          TODO_BACKEND_IMAGE_URI="$REGISTRY/$PROJECT_ID/$REPOSITORY/$TODO_BACKEND_IMAGE:$GITHUB_SHA"
          docker build --tag "$PROJECT_IMAGE_URI" exercise-3.3/project
          docker push "$PROJECT_IMAGE_URI"
          docker build --tag "$TODO_BACKEND_IMAGE_URI" exercise-3.3/project/todo-backend
          docker push "$TODO_BACKEND_IMAGE_URI"

      - name: Set up Kustomize
        uses: imranismail/setup-kustomize@v2

      - name: Deploy
        working-directory: exercise-3.3/project
        run: |
          PROJECT_IMAGE_URI="$REGISTRY/$PROJECT_ID/$REPOSITORY/$PROJECT_IMAGE:$GITHUB_SHA"
          TODO_BACKEND_IMAGE_URI="$REGISTRY/$PROJECT_ID/$REPOSITORY/$TODO_BACKEND_IMAGE:$GITHUB_SHA"
          kustomize edit set image PROJECT/PROJECT_IMAGE="$PROJECT_IMAGE_URI"
          kustomize edit set image PROJECT/TODO_BACKEND_IMAGE="$TODO_BACKEND_IMAGE_URI"
          kustomize build . | kubectl apply -f -
          kubectl rollout status deployment/project -n project --timeout=5m
          kubectl rollout status deployment/todo-backend -n project --timeout=5m

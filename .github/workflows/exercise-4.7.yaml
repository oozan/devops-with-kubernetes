name: GitOps release exercise 4.7 log-output

on:
  push:
    branches:
      - main
    paths:
      - "exercise-4.7/log-output/**"
      - ".github/workflows/exercise-4.7.yaml"

permissions:
  contents: write

env:
  PROJECT_ID: ${{ secrets.GKE_PROJECT }}
  REGISTRY: europe-north1-docker.pkg.dev
  REPOSITORY: dwk-repo
  IMAGE: log-output

jobs:
  build-publish-release:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GKE_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Configure Docker
        run: gcloud --quiet auth configure-docker "$REGISTRY"

      - name: Build and publish log-output
        run: |
          IMAGE_URI="$REGISTRY/$PROJECT_ID/$REPOSITORY/$IMAGE:$GITHUB_SHA"
          docker build --tag "$IMAGE_URI" exercise-4.7/log-output
          docker push "$IMAGE_URI"

      - name: Set up Kustomize
        uses: imranismail/setup-kustomize@v3

      - name: Update GitOps image
        working-directory: exercise-4.7/log-output
        run: |
          IMAGE_URI="$REGISTRY/$PROJECT_ID/$REPOSITORY/$IMAGE:$GITHUB_SHA"
          kustomize edit set image PROJECT/LOG_OUTPUT_IMAGE="$IMAGE_URI"

      - name: Commit release configuration
        uses: EndBug/add-and-commit@v10
        with:
          add: exercise-4.7/log-output/kustomization.yaml
          message: "Release exercise 4.7 log-output ${{ github.sha }}"

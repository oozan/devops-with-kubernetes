name: GitOps release exercise 4.8 project

on:
  push:
    branches:
      - main
    paths:
      - "exercise-4.8/project/**"
      - ".github/workflows/exercise-4.8.yaml"

permissions:
  contents: write

env:
  PROJECT_ID: ${{ secrets.GKE_PROJECT }}
  REGISTRY: europe-north1-docker.pkg.dev
  REPOSITORY: dwk-repo

jobs:
  build-publish-release:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GKE_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Configure Docker
        run: gcloud --quiet auth configure-docker "$REGISTRY"

      - name: Build and publish project
        run: |
          IMAGE_URI="$REGISTRY/$PROJECT_ID/$REPOSITORY/project:$GITHUB_SHA"
          docker build --tag "$IMAGE_URI" exercise-4.8/project
          docker push "$IMAGE_URI"

      - name: Build and publish todo-backend
        run: |
          IMAGE_URI="$REGISTRY/$PROJECT_ID/$REPOSITORY/todo-backend:$GITHUB_SHA"
          docker build --tag "$IMAGE_URI" exercise-4.8/project/todo-backend
          docker push "$IMAGE_URI"

      - name: Build and publish broadcaster
        run: |
          IMAGE_URI="$REGISTRY/$PROJECT_ID/$REPOSITORY/todo-broadcaster:$GITHUB_SHA"
          docker build --tag "$IMAGE_URI" exercise-4.8/project/broadcaster
          docker push "$IMAGE_URI"

      - name: Set up Kustomize
        uses: imranismail/setup-kustomize@v3

      - name: Update GitOps images
        working-directory: exercise-4.8/project
        run: |
          kustomize edit set image PROJECT/PROJECT_IMAGE="$REGISTRY/$PROJECT_ID/$REPOSITORY/project:$GITHUB_SHA"
          kustomize edit set image PROJECT/TODO_BACKEND_IMAGE="$REGISTRY/$PROJECT_ID/$REPOSITORY/todo-backend:$GITHUB_SHA"
          kustomize edit set image PROJECT/BROADCASTER_IMAGE="$REGISTRY/$PROJECT_ID/$REPOSITORY/todo-broadcaster:$GITHUB_SHA"

      - name: Commit release configuration
        uses: EndBug/add-and-commit@v10
        with:
          add: exercise-4.8/project/kustomization.yaml
          message: "Release exercise 4.8 project ${{ github.sha }}"
